<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:flex; flex-direction:column; gap:10px;">
    <div style="font-family:var(--font-mono); font-size:20px; font-weight:500; color:var(--cream-900); letter-spacing:0;">JetBrains Mono — for the things that count</div>
    <div style="display:grid; grid-template-columns:repeat(2, 1fr); gap:6px 24px; font-family:var(--font-mono); font-size:13px; color:var(--cream-800);">
      <div>SKU&nbsp;&nbsp;<span style="color:var(--cream-700);">VINO-CAB-750-2021</span></div>
      <div>Order&nbsp;&nbsp;<span style="color:var(--cream-700);">DF-2026-00471</span></div>
      <div>HSN&nbsp;&nbsp;<span style="color:var(--cream-700);">22042100</span></div>
      <div>GST&nbsp;&nbsp;<span style="color:var(--cream-700);">29ABCDE1234F1Z5</span></div>
    </div>
    <div style="display:flex; gap:18px; margin-top:4px; padding-top:10px; border-top:1px solid var(--cream-300); font-family:var(--font-body); font-size:11px; color:var(--cream-700);">
      <span>Tabular numerals on by default · tnum + ss01</span>
      <span style="margin-left:auto; font-family:var(--font-mono);">₹12,40,000.00</span>
    </div>
  </div>
</div>
</body></html>
