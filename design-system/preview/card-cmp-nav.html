<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .nav{display:flex; flex-direction:column; gap:2px;}
  .nav-item{display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; font-family:var(--font-body); font-size:14px; font-weight:500; color:var(--cream-800); cursor:pointer;}
  .nav-item:hover{background:var(--cream-200);}
  .nav-item.active{background:var(--teal-500); color:var(--cream-50);}
  .nav-item .ico{width:18px; height:18px; flex:0 0 18px; opacity:0.9;}
  .nav-item.active .ico{opacity:1;}
  .count{margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--cream-700); background:var(--cream-200); padding:1px 6px; border-radius:999px;}
  .nav-item.active .count{background:rgba(255,255,255,0.12); color:#C6DAD3;}
</style>
</head>
<body>
<div class="card" style="padding:16px;">
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
    <div class="nav">
      <div class="nav-item"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-6 9 6v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>Dashboard</div>
      <div class="nav-item active"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>Brands<span class="count">14</span></div>
      <div class="nav-item"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M19 8v6m-3-3h6"/></svg>Buyers<span class="count">142</span></div>
      <div class="nav-item"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>Cohorts</div>
    </div>
    <div class="nav">
      <div class="nav-item"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7"/><path d="M3 10h18"/><path d="M16 19h6m-3-3v6"/></svg>Price lists</div>
      <div class="nav-item"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V6a2 2 0 0 1 2-2h11l3 3v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Catalogs<span class="count">3</span></div>
      <div class="nav-item"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M3 4h2l3 12h11l2-8H6"/></svg>Orders<span class="count">28</span></div>
      <div class="nav-item"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18"/></svg>Settings</div>
    </div>
  </div>
</div>
</body></html>
