<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:grid; grid-template-columns:repeat(9, 1fr); gap:6px;">
    <div class="col"><div class="swatch light" style="background:#FDFBF7;">50</div></div>
    <div class="col"><div class="swatch light" style="background:#FAF7F2; box-shadow:0 0 0 2px var(--ember-400) inset, 0 0 0 3px var(--cream-100) inset;">100</div></div>
    <div class="col"><div class="swatch light" style="background:#F4EFE6;">200</div></div>
    <div class="col"><div class="swatch light" style="background:#EFE9DF;">300</div></div>
    <div class="col"><div class="swatch light" style="background:#E2D9C9;">400</div></div>
    <div class="col"><div class="swatch light" style="background:#C9BFAC;">500</div></div>
    <div class="col"><div class="swatch" style="background:#A89E89;">600</div></div>
    <div class="col"><div class="swatch" style="background:#6B6760;">700</div></div>
    <div class="col"><div class="swatch" style="background:#1A1A1A;">900</div></div>
  </div>
  <div style="margin-top:14px; display:flex; justify-content:space-between; font-family:var(--font-body); font-size:11px; color:var(--cream-700);">
    <span style="letter-spacing:0.14em; text-transform:uppercase; font-weight:600;">Cream — warm neutrals</span>
    <span style="font-family:var(--font-mono);">100 is the page · 300 is the hairline · 900 is the text</span>
  </div>
</div>
</body></html>
