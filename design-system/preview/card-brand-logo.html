<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card" style="display:flex; align-items:center; gap:32px;">
  <img src="../assets/logo-mark.svg" width="72" height="72" alt="">
  <div style="display:flex; flex-direction:column; gap:4px;">
    <div style="font-family:var(--font-display); font-size:34px; font-weight:500; letter-spacing:-0.02em; color:var(--cream-900); line-height:1;">DealFlow</div>
    <div style="font-family:var(--font-body); font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--cream-700);">Distributor Cockpit</div>
  </div>
  <div style="flex:1;"></div>
  <div style="display:flex; flex-direction:column; gap:6px; align-items:flex-end;">
    <div style="font-family:var(--font-mono); font-size:11px; color:var(--cream-700);">mark · 56px min</div>
    <div style="font-family:var(--font-mono); font-size:11px; color:var(--cream-700);">wordmark · Fraunces 500</div>
    <div style="font-family:var(--font-mono); font-size:11px; color:var(--cream-700);">teal-500 / ember-400 inset</div>
  </div>
</div>
</body></html>
