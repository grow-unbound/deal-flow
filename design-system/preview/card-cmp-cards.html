<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card" style="padding:24px;">
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
    <!-- Stat tile -->
    <div style="border:1px solid var(--cream-300); border-radius:14px; padding:18px; background:#fff;">
      <div style="font-family:var(--font-body); font-size:11px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--cream-700);">Orders today</div>
      <div style="font-family:var(--font-display); font-size:36px; font-weight:500; letter-spacing:-0.01em; color:var(--cream-900); line-height:1.1; margin-top:6px;">14</div>
      <div style="display:flex; align-items:center; gap:6px; margin-top:4px; font-family:var(--font-body); font-size:12px; color:var(--success-500);">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12l5-5 5 5M10 19V7"/></svg>
        <span>+3 vs yesterday</span>
      </div>
    </div>
    <!-- Brand tile -->
    <div style="border:1px solid var(--cream-300); border-radius:14px; padding:18px; background:#fff; display:flex; gap:14px; align-items:center;">
      <div style="width:48px; height:48px; border-radius:10px; background:var(--cream-200); border:1px solid var(--cream-300); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:18px; color:var(--teal-500);">WY</div>
      <div style="flex:1; min-width:0;">
        <div style="font-family:var(--font-body); font-weight:600; font-size:14px; color:var(--cream-900);">WineYard Vintners</div>
        <div style="font-family:var(--font-mono); font-size:11px; color:var(--cream-700); margin-top:2px;">82 SKUs · 4 cohorts</div>
      </div>
      <div style="font-family:var(--font-display); font-size:18px; font-weight:500; color:var(--teal-500);">↗</div>
    </div>
  </div>
  <div style="margin-top:14px; font-family:var(--font-body); font-size:11px; color:var(--cream-700);">Cards: 1px cream-300 border + white surface · radius-lg · subtle warm shadow optional</div>
</div>
</body></html>
