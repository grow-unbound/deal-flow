<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:14px;">
    <div>
      <div style="height:64px; background:#4A7C4E; border-radius:var(--radius-md); position:relative; padding:8px 10px; box-sizing:border-box; color:#fff; font-family:var(--font-mono); font-size:11px;">success</div>
      <div style="display:flex; gap:4px; margin-top:6px;">
        <div style="flex:1; height:18px; background:#ECF3EC; border-radius:4px;"></div>
        <div style="flex:1; height:18px; background:#2F5733; border-radius:4px;"></div>
      </div>
      <div style="margin-top:4px; font-family:var(--font-mono); font-size:10px; color:var(--cream-700);">moss · #4A7C4E</div>
    </div>
    <div>
      <div style="height:64px; background:#B07D2C; border-radius:var(--radius-md); padding:8px 10px; box-sizing:border-box; color:#fff; font-family:var(--font-mono); font-size:11px;">warning</div>
      <div style="display:flex; gap:4px; margin-top:6px;">
        <div style="flex:1; height:18px; background:#FBF1DC; border-radius:4px;"></div>
        <div style="flex:1; height:18px; background:#7A5519; border-radius:4px;"></div>
      </div>
      <div style="margin-top:4px; font-family:var(--font-mono); font-size:10px; color:var(--cream-700);">burnt gold · #B07D2C</div>
    </div>
    <div>
      <div style="height:64px; background:#9C3A22; border-radius:var(--radius-md); padding:8px 10px; box-sizing:border-box; color:#fff; font-family:var(--font-mono); font-size:11px;">danger</div>
      <div style="display:flex; gap:4px; margin-top:6px;">
        <div style="flex:1; height:18px; background:#F6E5DF; border-radius:4px;"></div>
        <div style="flex:1; height:18px; background:#6B2615; border-radius:4px;"></div>
      </div>
      <div style="margin-top:4px; font-family:var(--font-mono); font-size:10px; color:var(--cream-700);">rust · #9C3A22</div>
    </div>
    <div>
      <div style="height:64px; background:#3F6A7C; border-radius:var(--radius-md); padding:8px 10px; box-sizing:border-box; color:#fff; font-family:var(--font-mono); font-size:11px;">info</div>
      <div style="display:flex; gap:4px; margin-top:6px;">
        <div style="flex:1; height:18px; background:#E7EEF1; border-radius:4px;"></div>
        <div style="flex:1; height:18px; background:#2A4B59; border-radius:4px;"></div>
      </div>
      <div style="margin-top:4px; font-family:var(--font-mono); font-size:10px; color:var(--cream-700);">dusty blue · #3F6A7C</div>
    </div>
  </div>
</div>
</body></html>
