<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card" style="background:var(--cream-100);">
  <div style="display:flex; gap:20px; align-items:flex-end;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
      <div style="width:90px; height:60px; background:#fff; border:1px solid var(--cream-300); border-radius:10px; box-shadow:0 1px 2px rgba(31,58,52,0.04);"></div>
      <span style="font-family:var(--font-mono); font-size:10px; color:var(--cream-700);">xs</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
      <div style="width:90px; height:60px; background:#fff; border:1px solid var(--cream-300); border-radius:10px; box-shadow:0 1px 2px rgba(31,58,52,0.05), 0 1px 3px rgba(31,58,52,0.04);"></div>
      <span style="font-family:var(--font-mono); font-size:10px; color:var(--cream-700);">sm</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
      <div style="width:90px; height:60px; background:#fff; border:1px solid var(--cream-300); border-radius:10px; box-shadow:0 2px 4px rgba(31,58,52,0.04), 0 4px 12px rgba(31,58,52,0.06);"></div>
      <span style="font-family:var(--font-mono); font-size:10px; color:var(--cream-700);">md</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
      <div style="width:90px; height:60px; background:#fff; border:1px solid var(--cream-300); border-radius:10px; box-shadow:0 6px 16px rgba(31,58,52,0.06), 0 12px 32px rgba(31,58,52,0.08);"></div>
      <span style="font-family:var(--font-mono); font-size:10px; color:var(--cream-700);">lg</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
      <div style="width:90px; height:60px; background:#fff; border:1px solid var(--cream-300); border-radius:10px; box-shadow:0 16px 40px rgba(31,58,52,0.12), 0 4px 12px rgba(31,58,52,0.06);"></div>
      <span style="font-family:var(--font-mono); font-size:10px; color:var(--cream-700);">xl</span>
    </div>
  </div>
  <div style="margin-top:16px; font-family:var(--font-body); font-size:11px; color:var(--cream-700);">Warm teal-tinted shadows · borders carry most of the weight · xl only for floating overlays</div>
</div>
</body></html>
