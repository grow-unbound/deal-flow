<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DealFlow Cockpit · UI Kit</title>
<meta name="viewport" content="width=1280">
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="cockpit.css">
<link rel="icon" type="image/svg+xml" href="../../assets/logo-mark.svg">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="Common.jsx"></script>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="Dashboard.jsx"></script>
<script type="text/babel" src="Catalogs.jsx"></script>
<script type="text/babel" src="Publisher.jsx"></script>
<script type="text/babel" src="Orders.jsx"></script>

<script type="text/babel">
function App() {
  const [screen, setScreen] = React.useState('dashboard');

  // Map nav ids → screen ids. Some nav items (brands, products, buyers, cohorts, pricelists,
  // exports, settings) are scaffolds — we route them to a generic "Coming up" panel
  // for the kit demo, but keep the active state correct.
  const scaffolded = ['brands', 'products', 'buyers', 'cohorts', 'pricelists', 'exports', 'settings'];

  let active = screen;
  if (screen === 'publisher') active = 'catalogs';

  let content;
  if (screen === 'dashboard')       content = <Dashboard onNavigate={setScreen} data-screen-label="01 Dashboard" />;
  else if (screen === 'catalogs')   content = <Catalogs onPublish={() => setScreen('publisher')} data-screen-label="02 Catalogs" />;
  else if (screen === 'publisher')  content = <Publisher onDone={() => setScreen('catalogs')} onCancel={() => setScreen('catalogs')} data-screen-label="03 Catalog publisher" />;
  else if (screen === 'orders')     content = <Orders data-screen-label="04 Orders" />;
  else if (scaffolded.includes(screen)) {
    const labels = { brands:'Brands', products:'Products', buyers:'Buyers', cohorts:'Cohorts', pricelists:'Price lists', exports:'Exports', settings:'Settings' };
    content = (
      <div data-screen-label={`05 ${labels[screen]}`}>
        <PageHeader
          eyebrow={labels[screen]}
          title={`${labels[screen]} — sample scaffold`}
          subtitle="This kit ships four built-out screens (Dashboard, Catalogs, Publisher, Orders). The other nav items follow the same shell + table + filter pattern shown elsewhere."
          actions={<button className="cockpit-btn cockpit-btn-secondary" onClick={() => setScreen('dashboard')}>Back to dashboard</button>}
        />
        <EmptyState
          illustration="../../assets/illustration-empty-catalog.svg"
          title={`The ${labels[screen]} screen will land here`}
          body="In the production app this view follows the same shell, table, and filter patterns demonstrated on Catalogs and Orders. Kit scope is four screens."
          cta={<button className="cockpit-btn cockpit-btn-primary" onClick={() => setScreen('catalogs')}>See catalogs instead</button>}
        />
      </div>
    );
  }
  else content = <Dashboard onNavigate={setScreen} />;

  return (
    <Shell active={active} onNavigate={setScreen}>
      {content}
    </Shell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
