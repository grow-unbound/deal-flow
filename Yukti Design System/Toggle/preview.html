<!-- @dsCard group="Components" viewport="700x200" name="Toggle" subtitle="On · off · with label+hint · disabled · sizes" -->
<!doctype html>
<html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body{margin:0;padding:28px 28px;background:#F8F6F2;font-family:'Mukta',sans-serif;-webkit-font-smoothing:antialiased;color:#221E1A;}
  .row{display:flex;gap:32px;align-items:center;flex-wrap:wrap;margin-bottom:24px;}
  .row:last-child{margin-bottom:0;}
  .item{display:flex;flex-direction:column;align-items:flex-start;gap:8px;}
  .lbl{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.10em;text-transform:uppercase;color:#6F665C;}
  .track{display:inline-flex;align-items:center;border-radius:99px;position:relative;border:1px solid;}
  .knob{position:absolute;border-radius:50%;box-shadow:0 1px 3px rgba(34,30,26,.2);}
  .divider{width:1px;background:#EAE3D9;height:40px;}
</style>
</head>
<body>
<div class="row">
  <div class="item">
    <div class="track" style="width:40px;height:22px;background:#EAE3D9;border-color:rgba(100,89,78,.2);">
      <div class="knob" style="left:3px;width:16px;height:16px;background:#fff;"></div>
    </div>
    <span class="lbl">Off</span>
  </div>
  <div class="item">
    <div class="track" style="width:40px;height:22px;background:#B5642F;border-color:rgba(181,100,47,.5);">
      <div class="knob" style="left:21px;width:16px;height:16px;background:#F8F6F2;"></div>
    </div>
    <span class="lbl">On</span>
  </div>
  <div class="divider"></div>
  <div class="item">
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="track" style="width:40px;height:22px;background:#B5642F;border-color:rgba(181,100,47,.5);flex-shrink:0;">
        <div class="knob" style="left:21px;width:16px;height:16px;background:#F8F6F2;"></div>
      </div>
      <div>
        <div style="font-size:14px;font-weight:500;color:#221E1A;line-height:1.2;letter-spacing:-.01em;">Published</div>
        <div style="font-size:12px;color:#64594E;margin-top:2px;">Visible to assigned buyers</div>
      </div>
    </div>
    <span class="lbl">With label + hint</span>
  </div>
  <div class="item">
    <div style="display:flex;align-items:center;gap:10px;opacity:.5;cursor:not-allowed;">
      <div class="track" style="width:40px;height:22px;background:#EAE3D9;border-color:rgba(100,89,78,.2);flex-shrink:0;">
        <div class="knob" style="left:3px;width:16px;height:16px;background:#fff;"></div>
      </div>
      <span style="font-size:14px;font-weight:500;color:#221E1A;letter-spacing:-.01em;">GST exempt</span>
    </div>
    <span class="lbl">Disabled</span>
  </div>
  <div class="divider"></div>
  <div class="item">
    <div class="track" style="width:32px;height:18px;background:#B5642F;border-color:rgba(181,100,47,.5);">
      <div class="knob" style="left:17px;width:12px;height:12px;background:#F8F6F2;"></div>
    </div>
    <span class="lbl">sm · 32px</span>
  </div>
  <div class="item">
    <div class="track" style="width:40px;height:22px;background:#B5642F;border-color:rgba(181,100,47,.5);">
      <div class="knob" style="left:21px;width:16px;height:16px;background:#F8F6F2;"></div>
    </div>
    <span class="lbl">md · 40px</span>
  </div>
</div>
<div class="row">
  <div style="display:flex;gap:24px;align-items:center;padding:16px 20px;background:#FCFBF8;border:1px solid #EAE3D9;border-radius:12px;flex-wrap:wrap;">
    <span style="font-size:14px;font-weight:600;color:#221E1A;letter-spacing:-.01em;">Feature flags</span>
    <div style="display:flex;align-items:center;gap:10px;"><div class="track" style="width:40px;height:22px;background:#B5642F;border-color:rgba(181,100,47,.5);"><div class="knob" style="left:21px;width:16px;height:16px;background:#F8F6F2;"></div></div><span style="font-size:13.5px;font-weight:500;color:#221E1A;">Cohorts</span></div>
    <div style="display:flex;align-items:center;gap:10px;"><div class="track" style="width:40px;height:22px;background:#B5642F;border-color:rgba(181,100,47,.5);"><div class="knob" style="left:21px;width:16px;height:16px;background:#F8F6F2;"></div></div><span style="font-size:13.5px;font-weight:500;color:#221E1A;">Custom pricing</span></div>
    <div style="display:flex;align-items:center;gap:10px;"><div class="track" style="width:40px;height:22px;background:#EAE3D9;border-color:rgba(100,89,78,.2);"><div class="knob" style="left:3px;width:16px;height:16px;background:#fff;"></div></div><span style="font-size:13.5px;font-weight:500;color:#221E1A;">Tally export</span></div>
    <div style="display:flex;align-items:center;gap:10px;"><div class="track" style="width:40px;height:22px;background:#EAE3D9;border-color:rgba(100,89,78,.2);"><div class="knob" style="left:3px;width:16px;height:16px;background:#fff;"></div></div><span style="font-size:13.5px;font-weight:500;color:#6F665C;opacity:.7;">AI intake</span></div>
  </div>
</div>
</body></html>
