<!-- @dsCard group="Components" viewport="700x300" name="Select" subtitle="Custom styled dropdown — copper focus ring · hover tint · selected check · error · disabled" -->
<!doctype html>
<html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body{margin:0;padding:24px 28px;background:#F8F6F2;font-family:'Mukta',sans-serif;-webkit-font-smoothing:antialiased;color:#221E1A;}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;align-items:start;}
  .field{display:flex;flex-direction:column;gap:5px;position:relative;}
  .lbl{font-size:12.5px;font-weight:600;letter-spacing:.04em;color:#64594E;}
  .trig{display:flex;align-items:center;justify-content:space-between;gap:8px;height:42px;background:#FCFBF8;border:1px solid #EAE3D9;border-radius:10px;padding:0 12px;font-size:15px;letter-spacing:-.01em;}
  .trig.open{border-color:#B5642F;box-shadow:0 0 0 3px rgba(181,100,47,.14);}
  .trig.error{border-color:#9C3026;box-shadow:0 0 0 3px rgba(156,48,38,.10);}
  .trig.disabled{opacity:.6;background:rgba(248,246,242,.6);}
  .ph{color:#6F665C;}
  .chev{color:#6F665C;display:flex;}
  .chev.up{transform:rotate(180deg);}
  .menu{position:absolute;top:72px;left:0;right:0;background:#FCFBF8;border:1px solid #EAE3D9;border-radius:12px;box-shadow:0 12px 32px rgba(34,30,26,.12),0 4px 8px rgba(34,30,26,.06);padding:5px;z-index:5;}
  .opt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:8px;font-size:15px;letter-spacing:-.01em;color:#3a342e;}
  .opt.hov{background:rgba(34,30,26,.05);}
  .opt.sel{background:rgba(181,100,47,.08);color:#221E1A;font-weight:600;}
  .hint{font-size:12.5px;color:#6F665C;}
  .hint.err{color:#9C3026;}
</style>
</head>
<body>
<div class="grid">
  <div class="field">
    <span class="lbl">Cohort</span>
    <div class="trig open"><span>North Delhi A-class</span><span class="chev up"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3.5 5.5L7 9L10.5 5.5" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
    <div class="menu">
      <div class="opt sel">North Delhi A-class<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 7.5L5.5 10.5L11.5 4" stroke="#B5642F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="opt hov">Premium buyers</div>
      <div class="opt">Growth accounts</div>
      <div class="opt">Value accounts</div>
    </div>
  </div>
  <div class="field">
    <span class="lbl">Order status <span style="color:#9C3026;">*</span></span>
    <div class="trig error"><span class="ph">Select status…</span><span class="chev"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3.5 5.5L7 9L10.5 5.5" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
    <span class="hint err">Status is required</span>
  </div>
  <div class="field">
    <span class="lbl">Price list</span>
    <div class="trig disabled"><span>Standard 2026</span><span class="chev"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3.5 5.5L7 9L10.5 5.5" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
    <span class="hint">Read-only in this context</span>
  </div>
</div>
</body></html>
