<!-- @dsCard group="Components" viewport="700x200" name="Select" subtitle="Dropdown — default · error · disabled · with hint" -->
<!doctype html>
<html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  body{margin:0;padding:24px 28px;background:#F8F6F2;font-family:'Mukta',sans-serif;-webkit-font-smoothing:antialiased;color:#221E1A;}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:18px;align-items:start;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .lbl{font-size:12px;font-weight:600;letter-spacing:.04em;color:#64594E;}
  .sel-wrap{position:relative;display:flex;align-items:center;}
  select{width:100%;height:40px;background:#FCFBF8;border:1px solid #EAE3D9;border-radius:10px;padding:0 34px 0 12px;font-family:'Mukta',sans-serif;font-size:14px;color:#221E1A;letter-spacing:-.01em;appearance:none;-webkit-appearance:none;outline:none;cursor:pointer;}
  select.focused{border-color:#B5642F;box-shadow:0 0 0 3px rgba(181,100,47,.14);}
  select.error{border-color:#9C3026;box-shadow:0 0 0 3px rgba(156,48,38,.10);}
  select.disabled{opacity:.6;cursor:not-allowed;background:rgba(248,246,242,.6);}
  .arrow{position:absolute;right:12px;pointer-events:none;color:#6F665C;}
  .hint{font-size:12px;color:#6F665C;line-height:1.45;}
  .hint.err{color:#9C3026;}
</style>
</head>
<body>
<div class="grid">
  <div class="field">
    <span class="lbl">Cohort</span>
    <div class="sel-wrap">
      <select><option>North Delhi A-class</option><option>Premium</option></select>
      <span class="arrow"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3.5 5.5L7 9L10.5 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </div>
    <span class="hint">Buyer's assigned cohort</span>
  </div>
  <div class="field">
    <span class="lbl">Brand <span style="color:#9C3026;margin-left:1px;">*</span></span>
    <div class="sel-wrap">
      <select class="focused"><option>Amul</option><option>Parle</option></select>
      <span class="arrow"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3.5 5.5L7 9L10.5 5.5" stroke="#B5642F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </div>
    <span class="hint">Filter by brand principal</span>
  </div>
  <div class="field">
    <span class="lbl">Order status</span>
    <div class="sel-wrap">
      <select class="error"><option value="">Select status…</option></select>
      <span class="arrow"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3.5 5.5L7 9L10.5 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </div>
    <span class="hint err">Status is required</span>
  </div>
  <div class="field">
    <span class="lbl">Price list</span>
    <div class="sel-wrap">
      <select class="disabled" disabled><option>Standard 2026</option></select>
      <span class="arrow"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3.5 5.5L7 9L10.5 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </div>
    <span class="hint">Read-only in this context</span>
  </div>
</div>
</body></html>
