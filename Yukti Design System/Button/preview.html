<!-- @dsCard group="Components" viewport="700x210" name="Button" subtitle="Primary · secondary · ghost · danger · all sizes · disabled" -->
<!doctype html>
<html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  body{margin:0;padding:24px 28px;background:#F8F6F2;font-family:'Mukta',sans-serif;-webkit-font-smoothing:antialiased;color:#221E1A;}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px;}
  .row:last-child{margin-bottom:0;}
  .lbl{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.10em;text-transform:uppercase;color:#6F665C;width:56px;flex-shrink:0;}
  .btn{display:inline-flex;align-items:center;justify-content:center;font-family:'Mukta',sans-serif;font-weight:600;letter-spacing:-.01em;line-height:1;border:1px solid transparent;cursor:pointer;white-space:nowrap;}
  .btn-primary{background:#B5642F;color:#F8F6F2;box-shadow:0 1px 3px rgba(34,30,26,.18),inset 0 1px 0 rgba(255,255,255,.10);}
  .btn-secondary{background:#FCFBF8;color:#221E1A;border-color:#EAE3D9;box-shadow:0 1px 2px rgba(34,30,26,.06);}
  .btn-ghost{background:transparent;color:#221E1A;border-color:transparent;}
  .btn-danger{background:rgba(156,48,38,.10);color:#9C3026;border-color:rgba(156,48,38,.20);}
  .sm{font-size:12.5px;padding:0 12px;height:32px;border-radius:8px;}
  .md{font-size:14px;padding:0 18px;height:38px;border-radius:10px;}
  .lg{font-size:16px;padding:0 24px;height:46px;border-radius:11px;}
  .dis{opacity:.45;cursor:not-allowed;}
  .divider{width:100%;height:1px;background:#EAE3D9;margin:4px 0;}
</style>
</head>
<body>
<div class="row">
  <span class="lbl">variant</span>
  <button class="btn btn-primary md">Publish catalog</button>
  <button class="btn btn-secondary md">Export CSV</button>
  <button class="btn btn-ghost md">Cancel</button>
  <button class="btn btn-danger md">Delete order</button>
  <button class="btn btn-primary md dis">Disabled</button>
</div>
<div class="divider"></div>
<div class="row" style="margin-top:14px;">
  <span class="lbl">sizes</span>
  <button class="btn btn-primary lg">Large · 46px</button>
  <button class="btn btn-primary md">Medium · 38px</button>
  <button class="btn btn-primary sm">Small · 32px</button>
</div>
<div class="row" style="margin-top:10px;">
  <span class="lbl">icon</span>
  <button class="btn btn-primary md" style="gap:7px;">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 2V12M2 7H12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    Add product
  </button>
  <button class="btn btn-secondary md" style="gap:7px;">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 10L5 7L8 9.5L12 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    View analytics
  </button>
</div>
</body></html>
