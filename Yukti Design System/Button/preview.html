<!-- @dsCard group="Components" viewport="720x250" name="Button" subtitle="Primary (charcoal) · Accent (copper) · Secondary · Ghost · Danger · all sizes · disabled" -->
<!doctype html>
<html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  body{margin:0;padding:22px 28px;background:#F8F6F2;font-family:'Mukta',sans-serif;-webkit-font-smoothing:antialiased;color:#221E1A;}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  .row:last-child{margin-bottom:0;}
  .lbl{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.10em;text-transform:uppercase;color:#6F665C;width:58px;flex-shrink:0;}
  .btn{display:inline-flex;align-items:center;justify-content:center;font-family:'Mukta',sans-serif;font-weight:600;letter-spacing:-.01em;line-height:1;border:1px solid transparent;cursor:pointer;white-space:nowrap;gap:6px;}
  /* R11: primary = charcoal */
  .btn-primary{background:#221E1A;color:#F8F6F2;box-shadow:0 1px 3px rgba(34,30,26,.22),inset 0 1px 0 rgba(255,255,255,.06);}
  /* R11: accent = copper — use sparingly, max 1 per screen */
  .btn-accent{background:#B5642F;color:#F8F6F2;box-shadow:0 1px 3px rgba(181,100,47,.30),inset 0 1px 0 rgba(255,255,255,.10);}
  .btn-secondary{background:#FCFBF8;color:#221E1A;border-color:#EAE3D9;box-shadow:0 1px 2px rgba(34,30,26,.06);}
  .btn-ghost{background:transparent;color:#221E1A;}
  .btn-danger{background:rgba(156,48,38,.10);color:#9C3026;border-color:rgba(156,48,38,.20);}
  .sm{font-size:13px;padding:0 13px;height:34px;border-radius:8px;}
  .md{font-size:16px;padding:0 18px;height:40px;border-radius:10px;}
  .lg{font-size:17px;padding:0 24px;height:48px;border-radius:12px;}
  .dis{opacity:.45;cursor:not-allowed;}
  .rule{width:100%;height:1px;background:#EAE3D9;margin:4px 0 16px;}
  .note{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:#B5642F;padding:2px 7px;border-radius:4px;background:rgba(181,100,47,.10);}
</style>
</head>
<body>

<div class="row">
  <span class="lbl">variant</span>
  <button class="btn btn-primary md">Confirm order</button>
  <button class="btn btn-accent md">Publish catalog <span class="note" style="font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:#F8F6F2;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,.18);margin-left:2px;">1 per screen</span></button>
  <button class="btn btn-secondary md">Export CSV</button>
  <button class="btn btn-ghost md">Cancel</button>
  <button class="btn btn-danger md">Delete</button>
</div>

<div class="rule"></div>

<div class="row">
  <span class="lbl">sizes</span>
  <button class="btn btn-primary lg">Large · 48px</button>
  <button class="btn btn-primary md">Medium · 40px · default</button>
  <button class="btn btn-primary sm">Small · 34px</button>
  <button class="btn btn-primary md dis">Disabled</button>
</div>

<div class="row" style="margin-top:4px;">
  <span class="lbl">icon</span>
  <button class="btn btn-primary md">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 2V12M2 7H12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    Add product
  </button>
  <button class="btn btn-accent md">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 2V12M2 7H12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    Place order
  </button>
  <button class="btn btn-secondary md">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 10L5 7L8 9.5L12 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    View analytics
  </button>
</div>

</body></html>
