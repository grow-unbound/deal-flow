<!-- @dsCard group="Components" viewport="700x200" name="Status Chip" subtitle="Order lifecycle · catalog · entity states · shape + label always" -->
<!doctype html>
<html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body{margin:0;padding:26px 28px;background:#F8F6F2;font-family:'Mukta',sans-serif;-webkit-font-smoothing:antialiased;color:#221E1A;}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
  .row:last-child{margin-bottom:0;}
  .chip{display:inline-flex;align-items:center;gap:6px;font-family:'Mukta',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:-.01em;padding:4px 10px;border-radius:8px;border:1px solid;white-space:nowrap;}
  .grp{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.10em;text-transform:uppercase;color:#6F665C;width:56px;flex-shrink:0;}
</style>
</head>
<body>
<div class="row">
  <span class="grp">orders</span>
  <span class="chip" style="color:#2A5F8A;background:rgba(42,95,138,.10);border-color:rgba(42,95,138,.20);"><svg width="7" height="7" viewBox="0 0 7 7" fill="none"><circle cx="3.5" cy="3.5" r="3" stroke="#2A5F8A" stroke-width="1.3"/></svg>Received</span>
  <span class="chip" style="color:#6a3d18;background:rgba(181,100,47,.12);border-color:rgba(181,100,47,.22);"><svg width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M1.5 4.5L3.5 6.5L7.5 2.5" stroke="#6a3d18" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Confirmed</span>
  <span class="chip" style="color:#2A5F8A;background:rgba(42,95,138,.12);border-color:rgba(42,95,138,.22);"><svg width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M1.5 4.5H7.5M5 2L7.5 4.5L5 7" stroke="#2A5F8A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Dispatched</span>
  <span class="chip" style="color:#1F6B3A;background:rgba(31,107,58,.12);border-color:rgba(31,107,58,.22);"><svg width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M1.5 4.5L3.5 6.5L7.5 2.5" stroke="#1F6B3A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Delivered</span>
  <span class="chip" style="color:#9C3026;background:rgba(156,48,38,.10);border-color:rgba(156,48,38,.20);"><svg width="9" height="9" viewBox="0 0 9 9" fill="none"><line x1="2" y1="2" x2="7" y2="7" stroke="#9C3026" stroke-width="1.5" stroke-linecap="round"/><line x1="7" y1="2" x2="2" y2="7" stroke="#9C3026" stroke-width="1.5" stroke-linecap="round"/></svg>Cancelled</span>
</div>
<div class="row">
  <span class="grp">catalog</span>
  <span class="chip" style="color:#64594E;background:rgba(100,89,78,.08);border-color:rgba(100,89,78,.18);"><svg width="7" height="7" viewBox="0 0 7 7" fill="none"><circle cx="3.5" cy="3.5" r="3" stroke="#64594E" stroke-width="1.2" stroke-dasharray="2 1.4"/></svg>Draft</span>
  <span class="chip" style="color:#6a3d18;background:rgba(181,100,47,.14);border-color:rgba(181,100,47,.24);"><svg width="7" height="7" viewBox="0 0 7 7"><circle cx="3.5" cy="3.5" r="3.5" fill="#B5642F"/></svg>Published</span>
  <span class="chip" style="color:#64594E;background:rgba(100,89,78,.06);border-color:rgba(100,89,78,.14);"><svg width="8" height="8" viewBox="0 0 8 8" fill="none"><rect x="1" y="1" width="6" height="6" rx="1.5" stroke="#64594E" stroke-width="1.2"/></svg>Archived</span>
</div>
<div class="row">
  <span class="grp">entity</span>
  <span class="chip" style="color:#1F6B3A;background:rgba(31,107,58,.12);border-color:rgba(31,107,58,.22);"><svg width="7" height="7" viewBox="0 0 7 7"><circle cx="3.5" cy="3.5" r="3.5" fill="#1F6B3A"/></svg>Active</span>
  <span class="chip" style="color:#64594E;background:rgba(100,89,78,.08);border-color:rgba(100,89,78,.18);"><svg width="7" height="7" viewBox="0 0 7 7" fill="none"><circle cx="3.5" cy="3.5" r="3" stroke="#64594E" stroke-width="1.2" stroke-dasharray="2 1.4"/></svg>Inactive</span>
  <span class="chip" style="color:#8A5700;background:rgba(138,87,0,.10);border-color:rgba(138,87,0,.20);"><svg width="7" height="7" viewBox="0 0 7 7" fill="none"><circle cx="3.5" cy="3.5" r="3" stroke="#8A5700" stroke-width="1.3"/></svg>Pending</span>
</div>
</body></html>
