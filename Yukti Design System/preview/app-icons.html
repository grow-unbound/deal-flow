<!-- @dsCard group="Brand" viewport="700x400" name="App Icons & Favicons" subtitle="PWA · iOS · Android · Favicon — dark surface is the primary" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body{margin:0;padding:24px 28px;background:#F8F7F3;font-family:'Mukta',sans-serif;-webkit-font-smoothing:antialiased;color:#221E1A;}
  .slbl{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#6F665C;margin:0 0 10px;}
  .row{display:flex;gap:10px;margin-bottom:18px;}
  .cell{flex:1;border-radius:12px;border:1px solid #EAE3D9;overflow:hidden;}
  .stage{display:flex;align-items:center;justify-content:center;}
  .cap{padding:9px 14px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.05em;text-transform:uppercase;background:#FFFFFF;border-top:1px solid #EAE3D9;color:#6F665C;}
  .cap b{color:#221E1A;}
  .cap.dk{background:#1D1A17;border-color:#393330;color:rgba(243,238,230,.5);}
  .cap.dk b{color:#F3EEE6;}
  .sep{height:1px;background:#EAE3D9;margin:0 0 18px;}
  .pxlbl{font-family:'JetBrains Mono',monospace;font-size:8.5px;color:#6F665C;text-align:center;}
</style>
</head>
<body>

<!-- Row 1: Hero + size scale -->
<div class="slbl">App icon — primary</div>
<div class="row">

  <!-- Hero icon -->
  <div class="cell">
    <div class="stage" style="background:#ECEAE5;padding:28px 20px;flex-direction:column;gap:14px;">
      <div style="width:120px;height:120px;border-radius:26px;background:#2B2825;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 40px rgba(34,30,26,.22),0 3px 8px rgba(34,30,26,.10);">
        <svg width="68" height="68" viewBox="0 0 32 32" fill="none">
          <path fill="#D9894C" d="M4.2 15.9L10.6 17.0L12.5 25.1L6.4 25.1Z"/>
          <path fill="#D9894C" d="M27.8 15.9L21.4 17.0L19.5 25.1L25.6 25.1Z"/>
          <path fill="#D9894C" d="M13 7.4L19 7.4L21.2 16.6L10.8 16.6Z"/>
        </svg>
      </div>
      <span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:#6F665C;letter-spacing:.04em;">#2B2825 · copper-lt mark</span>
    </div>
    <div class="cap dk"><b>Primary</b> — iOS · Android · PWA</div>
  </div>

  <!-- Size scale -->
  <div class="cell" style="flex:2.2;">
    <div class="stage" style="background:#F8F7F3;padding:22px 28px;">
      <div style="display:flex;align-items:flex-end;gap:16px;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
          <div style="width:80px;height:80px;border-radius:18px;background:#2B2825;display:flex;align-items:center;justify-content:center;">
            <svg width="46" height="46" viewBox="0 0 32 32" fill="none"><path fill="#D9894C" d="M4.2 15.9L10.6 17.0L12.5 25.1L6.4 25.1Z"/><path fill="#D9894C" d="M27.8 15.9L21.4 17.0L19.5 25.1L25.6 25.1Z"/><path fill="#D9894C" d="M13 7.4L19 7.4L21.2 16.6L10.8 16.6Z"/></svg>
          </div>
          <span class="pxlbl">512</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
          <div style="width:60px;height:60px;border-radius:13px;background:#2B2825;display:flex;align-items:center;justify-content:center;">
            <svg width="34" height="34" viewBox="0 0 32 32" fill="none"><path fill="#D9894C" d="M4.2 15.9L10.6 17.0L12.5 25.1L6.4 25.1Z"/><path fill="#D9894C" d="M27.8 15.9L21.4 17.0L19.5 25.1L25.6 25.1Z"/><path fill="#D9894C" d="M13 7.4L19 7.4L21.2 16.6L10.8 16.6Z"/></svg>
          </div>
          <span class="pxlbl">192</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
          <div style="width:44px;height:44px;border-radius:10px;background:#2B2825;display:flex;align-items:center;justify-content:center;">
            <svg width="26" height="26" viewBox="0 0 32 32" fill="none"><path fill="#D9894C" d="M4.2 15.9L10.6 17.0L12.5 25.1L6.4 25.1Z"/><path fill="#D9894C" d="M27.8 15.9L21.4 17.0L19.5 25.1L25.6 25.1Z"/><path fill="#D9894C" d="M13 7.4L19 7.4L21.2 16.6L10.8 16.6Z"/></svg>
          </div>
          <span class="pxlbl">120</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
          <div style="width:32px;height:32px;border-radius:7px;background:#2B2825;display:flex;align-items:center;justify-content:center;">
            <svg width="18" height="18" viewBox="0 0 32 32" fill="none"><path fill="#D9894C" d="M4.2 15.9L10.6 17.0L12.5 25.1L6.4 25.1Z"/><path fill="#D9894C" d="M27.8 15.9L21.4 17.0L19.5 25.1L25.6 25.1Z"/><path fill="#D9894C" d="M13 7.4L19 7.4L21.2 16.6L10.8 16.6Z"/></svg>
          </div>
          <span class="pxlbl">32</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
          <div style="width:20px;height:20px;border-radius:4px;background:#2B2825;display:flex;align-items:center;justify-content:center;">
            <svg width="12" height="12" viewBox="0 0 32 32" fill="none"><path fill="#D9894C" d="M4.2 15.9L10.6 17.0L12.5 25.1L6.4 25.1Z"/><path fill="#D9894C" d="M27.8 15.9L21.4 17.0L19.5 25.1L25.6 25.1Z"/><path fill="#D9894C" d="M13 7.4L19 7.4L21.2 16.6L10.8 16.6Z"/></svg>
          </div>
          <span class="pxlbl">16</span>
        </div>
      </div>
    </div>
    <div class="cap"><b>Size scale</b> — 1024px source · export per platform</div>
  </div>

</div>

<div class="sep"></div>

<!-- Row 2: Variants + Favicon context -->
<div class="slbl">Variants · Favicon context</div>
<div class="row" style="margin-bottom:0;">

  <!-- Dark surface (primary) -->
  <div class="cell">
    <div class="stage" style="background:#E8E5DF;padding:22px 20px;">
      <div style="width:72px;height:72px;border-radius:16px;background:#2B2825;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(34,30,26,.20);">
        <svg width="40" height="40" viewBox="0 0 32 32" fill="none"><path fill="#D9894C" d="M4.2 15.9L10.6 17.0L12.5 25.1L6.4 25.1Z"/><path fill="#D9894C" d="M27.8 15.9L21.4 17.0L19.5 25.1L25.6 25.1Z"/><path fill="#D9894C" d="M13 7.4L19 7.4L21.2 16.6L10.8 16.6Z"/></svg>
      </div>
    </div>
    <div class="cap dk"><b>Dark surface</b> — primary</div>
  </div>

  <!-- Paper light -->
  <div class="cell">
    <div class="stage" style="background:#E0DDD7;padding:22px 20px;">
      <div style="width:72px;height:72px;border-radius:16px;background:#F8F7F3;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(34,30,26,.12);border:1px solid #EAE3D9;">
        <svg width="40" height="40" viewBox="0 0 32 32" fill="none"><path fill="#B5642F" d="M4.2 15.9L10.6 17.0L12.5 25.1L6.4 25.1Z"/><path fill="#B5642F" d="M27.8 15.9L21.4 17.0L19.5 25.1L25.6 25.1Z"/><path fill="#B5642F" d="M13 7.4L19 7.4L21.2 16.6L10.8 16.6Z"/></svg>
      </div>
    </div>
    <div class="cap"><b>Paper light</b> — alternate</div>
  </div>

  <!-- Copper solid (expressive) -->
  <div class="cell">
    <div class="stage" style="background:#E0DDD7;padding:22px 20px;">
      <div style="width:72px;height:72px;border-radius:16px;background:#B5642F;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 24px rgba(181,100,47,.38);">
        <svg width="40" height="40" viewBox="0 0 32 32" fill="none"><path fill="#F3EEE6" d="M4.2 15.9L10.6 17.0L12.5 25.1L6.4 25.1Z"/><path fill="#F3EEE6" d="M27.8 15.9L21.4 17.0L19.5 25.1L25.6 25.1Z"/><path fill="#F3EEE6" d="M13 7.4L19 7.4L21.2 16.6L10.8 16.6Z"/></svg>
      </div>
    </div>
    <div class="cap"><b>Copper solid</b> — expressive</div>
  </div>

  <!-- Favicon browser context -->
  <div class="cell" style="flex:1.5;">
    <div class="stage" style="background:#D6D2C9;padding:16px 18px;flex-direction:column;gap:6px;align-items:stretch;justify-content:center;">
      <!-- Browser tab strip -->
      <div style="display:flex;gap:0;align-items:flex-end;">
        <div style="background:#C0BAB1;border-radius:8px 8px 0 0;padding:5px 10px;display:flex;align-items:center;gap:6px;min-width:0;max-width:160px;">
          <div style="width:16px;height:16px;flex:none;background:#2B2825;border-radius:3px;display:flex;align-items:center;justify-content:center;">
            <svg width="9" height="9" viewBox="0 0 32 32" fill="none"><path fill="#D9894C" d="M4.2 15.9L10.6 17.0L12.5 25.1L6.4 25.1Z"/><path fill="#D9894C" d="M27.8 15.9L21.4 17.0L19.5 25.1L25.6 25.1Z"/><path fill="#D9894C" d="M13 7.4L19 7.4L21.2 16.6L10.8 16.6Z"/></svg>
          </div>
          <span style="font-family:'Mukta',sans-serif;font-size:11px;color:#221E1A;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;">Yukti</span>
          <span style="font-size:10px;color:#6F665C;flex:none;">✕</span>
        </div>
      </div>
      <!-- URL bar -->
      <div style="background:#E8E5DF;border-radius:0 8px 8px 8px;padding:7px 10px;">
        <div style="background:#F8F7F3;border-radius:5px;padding:4px 10px;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:#6F665C;">app.yukti.io</div>
      </div>
    </div>
    <div class="cap"><b>Favicon</b> — 16px · adaptive SVG</div>
  </div>

</div>

</body>
</html>
