<!-- @dsCard group="Components" viewport="700x180" name="Search Bar" subtitle="3 sizes · with shortcut badge · with clear · disabled" -->
<!doctype html>
<html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body{margin:0;padding:28px 28px;background:#F8F6F2;font-family:'Mukta',sans-serif;-webkit-font-smoothing:antialiased;color:#221E1A;}
  .row{display:flex;gap:16px;align-items:flex-end;margin-bottom:18px;}
  .row:last-child{margin-bottom:0;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .lbl{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.10em;text-transform:uppercase;color:#6F665C;}
  .bar{display:flex;align-items:center;gap:8px;background:#FCFBF8;border:1px solid #EAE3D9;padding:0 12px;}
  input{border:none;outline:none;background:transparent;font-family:'Mukta',sans-serif;color:#221E1A;letter-spacing:-.01em;}
  input::placeholder{color:#6F665C;}
  .kbd{font-family:'JetBrains Mono',monospace;font-size:10px;color:#6F665C;background:#EAE3D9;padding:2px 6px;border-radius:4px;flex-shrink:0;letter-spacing:.04em;}
</style>
</head>
<body>
<div class="row">
  <div class="field" style="flex:1;">
    <div class="bar" style="height:44px;border-radius:11px;">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0;color:#6F665C;"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M11 11L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input type="text" placeholder="Search products, buyers, orders…" style="font-size:15px;flex:1;">
      <span class="kbd">⌘K</span>
    </div>
    <span class="lbl">lg · 44px · shortcut</span>
  </div>
  <div class="field" style="width:260px;">
    <div class="bar" style="height:38px;border-radius:10px;">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style="flex-shrink:0;color:#6F665C;"><circle cx="6" cy="6" r="4" stroke="currentColor" stroke-width="1.4"/><path d="M9.5 9.5L12 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input type="text" value="Amul Butter" style="font-size:14px;flex:1;">
      <button style="background:none;border:none;cursor:pointer;color:#6F665C;padding:1px;display:flex;"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><line x1="3" y1="3" x2="10" y2="10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="10" y1="3" x2="3" y2="10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
    </div>
    <span class="lbl">md · 38px · has value · clear</span>
  </div>
  <div class="field" style="width:200px;">
    <div class="bar" style="height:32px;border-radius:8px;opacity:.6;cursor:not-allowed;">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" style="flex-shrink:0;color:#6F665C;"><circle cx="5.5" cy="5.5" r="3.5" stroke="currentColor" stroke-width="1.4"/><path d="M8.5 8.5L11 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input type="text" placeholder="Search…" style="font-size:12.5px;flex:1;" disabled>
    </div>
    <span class="lbl">sm · 32px · disabled</span>
  </div>
</div>
</body></html>
