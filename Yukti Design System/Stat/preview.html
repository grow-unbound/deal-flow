<!-- @dsCard group="Components" viewport="700x180" name="Stat" subtitle="KPI cards — JetBrains Mono · proportional ₹ prefix · 2.0 trend arrows · dark variant" -->
<!doctype html>
<html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body{margin:0;padding:24px 28px;background:#F8F6F2;font-family:'Mukta',sans-serif;-webkit-font-smoothing:antialiased;color:#221E1A;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .card{border:1px solid #EAE3D9;border-radius:12px;padding:16px 18px;}
  .mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;}
</style>
</head>
<body>
<div class="grid">
  <div class="card" style="background:#FCFBF8;">
    <div class="mono" style="font-size:10px;letter-spacing:.10em;text-transform:uppercase;color:#6F665C;margin-bottom:8px;">Orders · Jun</div>
    <div class="mono" style="font-size:28px;font-weight:500;color:#221E1A;letter-spacing:-.02em;line-height:1;">247</div>
    <div style="display:flex;align-items:center;gap:4px;margin-top:7px;">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 9L5 5.5L8 8L10.5 4.5" stroke="#1F6B3A" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span style="font-family:'Mukta',sans-serif;font-size:12px;color:#1F6B3A;font-weight:600;">+18%</span>
      <span style="font-family:'Mukta',sans-serif;font-size:12px;color:#6F665C;">vs last month</span>
    </div>
  </div>
  <div class="card" style="background:#FCFBF8;">
    <div class="mono" style="font-size:10px;letter-spacing:.10em;text-transform:uppercase;color:#6F665C;margin-bottom:8px;">Revenue · Jun</div>
    <!-- ₹ prefix: marginRight 1px — reads as one unit with the number -->
    <div class="mono" style="font-size:28px;font-weight:500;color:#221E1A;letter-spacing:-.02em;line-height:1;"><span style="font-size:0.58em;margin-right:0.5px;opacity:.9;">₹</span>4.2L</div>
    <div style="display:flex;align-items:center;gap:4px;margin-top:7px;">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 9L5 5.5L8 8L10.5 4.5" stroke="#1F6B3A" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span style="font-family:'Mukta',sans-serif;font-size:12px;color:#1F6B3A;font-weight:600;">+24%</span>
      <span style="font-family:'Mukta',sans-serif;font-size:12px;color:#6F665C;">vs last month</span>
    </div>
  </div>
  <div class="card" style="background:#FCFBF8;border-color:rgba(156,48,38,.20);">
    <div class="mono" style="font-size:10px;letter-spacing:.10em;text-transform:uppercase;color:#6F665C;margin-bottom:8px;">Avg order value</div>
    <div class="mono" style="font-size:28px;font-weight:500;color:#221E1A;letter-spacing:-.02em;line-height:1;"><span style="font-size:0.58em;margin-right:0.5px;opacity:.9;">₹</span>1,840</div>
    <div style="display:flex;align-items:center;gap:4px;margin-top:7px;">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 4.5L5 7L8 5L10.5 8.5" stroke="#9C3026" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span style="font-family:'Mukta',sans-serif;font-size:12px;color:#9C3026;font-weight:600;">-6%</span>
      <span style="font-family:'Mukta',sans-serif;font-size:12px;color:#6F665C;">vs last month</span>
    </div>
  </div>
  <div class="card" style="background:#2B2825;border-color:rgba(255,255,255,.08);">
    <div class="mono" style="font-size:10px;letter-spacing:.10em;text-transform:uppercase;color:rgba(243,238,230,.55);margin-bottom:8px;">Active buyers</div>
    <div class="mono" style="font-size:28px;font-weight:500;color:#F3EEE6;letter-spacing:-.02em;line-height:1;">84</div>
    <div style="display:flex;align-items:center;gap:4px;margin-top:7px;">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 9L5 5.5L8 8L10.5 4.5" stroke="#6dcf95" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span style="font-family:'Mukta',sans-serif;font-size:12px;color:#6dcf95;font-weight:600;">+7</span>
      <span style="font-family:'Mukta',sans-serif;font-size:12px;color:rgba(243,238,230,.55);">this month</span>
    </div>
  </div>
</div>
</body></html>
