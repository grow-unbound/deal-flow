<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card" style="padding:20px; background:var(--cream-100);">
  <div style="display:grid; grid-template-columns:repeat(2, 1fr); gap:14px;">
    <!-- buyer-app catalog card -->
    <div style="background:#fff; border-radius:20px; overflow:hidden; box-shadow:0 2px 4px rgba(31,58,52,0.04), 0 4px 12px rgba(31,58,52,0.06);">
      <div style="height:120px; background:linear-gradient(135deg, #5D8E81 0%, #1F3A34 60%, #142823 100%); position:relative; display:flex; align-items:flex-end; padding:14px;">
        <div style="position:absolute; top:10px; right:10px; padding:3px 10px; background:var(--ember-400); color:#fff; border-radius:999px; font-family:var(--font-body); font-size:10px; font-weight:600; letter-spacing:0.04em;">NEW</div>
        <div style="font-family:var(--font-display); font-size:22px; font-weight:500; color:#FAF7F2; line-height:1.1;">Summer Pours</div>
      </div>
      <div style="padding:14px;">
        <div style="font-family:var(--font-body); font-size:12px; color:var(--cream-700);">28 products · valid until 31 May</div>
        <div style="display:flex; align-items:baseline; gap:8px; margin-top:6px;">
          <span style="font-family:var(--font-display); font-size:24px; font-weight:500; color:var(--cream-900);">₹84,200</span>
          <span style="font-family:var(--font-body); font-size:11px; color:var(--cream-600); text-decoration:line-through;">MRP ₹98,000</span>
        </div>
      </div>
    </div>
    <!-- product card -->
    <div style="background:#fff; border-radius:20px; overflow:hidden; border:1px solid var(--cream-300);">
      <div style="aspect-ratio:1.1; background:linear-gradient(180deg, #F4EFE6 0%, #EFE9DF 100%); display:flex; align-items:center; justify-content:center;">
        <div style="width:38px; height:96px; background:linear-gradient(180deg, #1F3A34, #142823); border-radius:6px 6px 4px 4px; position:relative;">
          <div style="position:absolute; top:32px; left:0; right:0; height:32px; background:#FAF7F2; border-radius:1px;"></div>
        </div>
      </div>
      <div style="padding:14px;">
        <div style="font-family:var(--font-body); font-size:10px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--cream-700);">WineYard Vintners</div>
        <div style="font-family:var(--font-display); font-size:16px; font-weight:500; color:var(--cream-900); margin-top:4px; line-height:1.2;">Cabernet Sauvignon 2021</div>
        <div style="display:flex; align-items:baseline; justify-content:space-between; margin-top:8px;">
          <span style="font-family:var(--font-display); font-size:18px; font-weight:500; color:var(--cream-900); font-variant-numeric:tabular-nums;">₹2,450</span>
          <span style="font-family:var(--font-body); font-size:11px; color:var(--cream-700);">/ bottle</span>
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>
