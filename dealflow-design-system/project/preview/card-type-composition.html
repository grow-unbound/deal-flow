<!doctype html>
<!-- @dsCard group="Type" name="Type composition" subtitle="Eyebrow + display heading + body" viewport="700x250" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:flex; flex-direction:column; gap:4px;">
    <div style="font-family:var(--font-body); font-size:11px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:var(--cream-700);">This week's activity</div>
    <div style="font-family:var(--font-display); font-size:32px; line-height:1.08; letter-spacing:-0.01em; font-weight:500; color:var(--cream-900);">14 orders, 3 catalogs published</div>
    <div style="font-family:var(--font-body); font-size:14px; line-height:1.55; color:var(--cream-700); margin-top:2px;">Across 8 buyers and 5 brand principals.</div>
    <div style="height:14px;"></div>
    <div style="font-family:var(--font-body); font-size:13px; line-height:1.6; color:var(--cream-800); padding-top:12px; border-top:1px solid var(--cream-300);">A typical page composition: <strong style="font-weight:600;">eyebrow</strong> (uppercase, tracked), then <strong style="font-weight:600;">display heading</strong> in Fraunces 500, then <strong style="font-weight:600;">body</strong> in Inter. The eyebrow is the only place we use uppercase — never on buttons or labels.</div>
  </div>
</div>
