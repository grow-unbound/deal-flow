<!doctype html>
<!-- @dsCard group="Colors" name="Semantic tokens (fg/bg)" subtitle="fg-1…fg-4, bg-page, bg-brand, soft tints" viewport="700x270" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:24px;">
    <div>
      <div class="eyebrow">Foreground</div>
      <div style="display:flex; flex-direction:column; gap:6px; font-family:var(--font-body); font-size:13px;">
        <div style="display:flex; justify-content:space-between; align-items:center;"><span style="color:#1A1A1A;">fg-1 · primary copy</span><span style="font-family:var(--font-mono); font-size:11px; color:var(--cream-700);">cream-900</span></div>
        <div style="display:flex; justify-content:space-between; align-items:center;"><span style="color:#3D3A35;">fg-2 · secondary</span><span style="font-family:var(--font-mono); font-size:11px; color:var(--cream-700);">cream-800</span></div>
        <div style="display:flex; justify-content:space-between; align-items:center;"><span style="color:#6B6760;">fg-3 · muted / captions</span><span style="font-family:var(--font-mono); font-size:11px; color:var(--cream-700);">cream-700</span></div>
        <div style="display:flex; justify-content:space-between; align-items:center;"><span style="color:#A89E89;">fg-4 · placeholder</span><span style="font-family:var(--font-mono); font-size:11px; color:var(--cream-700);">cream-600</span></div>
        <div style="display:flex; justify-content:space-between; align-items:center;"><span style="color:#1F3A34;">fg-brand</span><span style="font-family:var(--font-mono); font-size:11px; color:var(--cream-700);">teal-500</span></div>
        <div style="display:flex; justify-content:space-between; align-items:center;"><span style="color:#C26E3A;">fg-accent</span><span style="font-family:var(--font-mono); font-size:11px; color:var(--cream-700);">ember-400</span></div>
      </div>
    </div>
    <div>
      <div class="eyebrow">Background</div>
      <div style="display:flex; flex-direction:column; gap:6px; font-family:var(--font-body); font-size:13px;">
        <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 10px; background:#FAF7F2; border-radius:6px; border:1px solid var(--cream-300);"><span>bg-page</span><span style="font-family:var(--font-mono); font-size:11px; color:var(--cream-700);">cream-100</span></div>
        <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 10px; background:#FFFFFF; border-radius:6px; border:1px solid var(--cream-300);"><span>bg-surface</span><span style="font-family:var(--font-mono); font-size:11px; color:var(--cream-700);">#FFFFFF</span></div>
        <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 10px; background:#F4EFE6; border-radius:6px;"><span>bg-recessed</span><span style="font-family:var(--font-mono); font-size:11px; color:var(--cream-700);">cream-200</span></div>
        <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 10px; background:#1F3A34; border-radius:6px; color:#FAF7F2;"><span>bg-brand</span><span style="font-family:var(--font-mono); font-size:11px; color:#C6DAD3;">teal-500</span></div>
        <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 10px; background:#EAF1EE; border-radius:6px;"><span>bg-brand-soft</span><span style="font-family:var(--font-mono); font-size:11px; color:var(--cream-700);">teal-50</span></div>
        <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 10px; background:#FBEFE3; border-radius:6px;"><span>bg-accent-soft</span><span style="font-family:var(--font-mono); font-size:11px; color:var(--cream-700);">ember-50</span></div>
      </div>
    </div>
  </div>
</div>
</body></html>
