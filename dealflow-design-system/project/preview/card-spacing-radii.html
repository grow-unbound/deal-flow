<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:flex; align-items:center; justify-content:space-around;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
      <div style="width:56px; height:56px; background:var(--cream-200); border:1px solid var(--cream-300); border-radius:4px;"></div>
      <span style="font-family:var(--font-mono); font-size:10px; color:var(--cream-700);">xs · 4</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
      <div style="width:56px; height:56px; background:var(--cream-200); border:1px solid var(--cream-300); border-radius:6px;"></div>
      <span style="font-family:var(--font-mono); font-size:10px; color:var(--cream-700);">sm · 6</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
      <div style="width:56px; height:56px; background:var(--cream-200); border:1px solid var(--cream-300); border-radius:10px;"></div>
      <span style="font-family:var(--font-mono); font-size:10px; color:var(--cream-700);">md · 10</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
      <div style="width:56px; height:56px; background:var(--cream-200); border:1px solid var(--cream-300); border-radius:14px;"></div>
      <span style="font-family:var(--font-mono); font-size:10px; color:var(--cream-700);">lg · 14</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
      <div style="width:56px; height:56px; background:var(--cream-200); border:1px solid var(--cream-300); border-radius:20px;"></div>
      <span style="font-family:var(--font-mono); font-size:10px; color:var(--cream-700);">xl · 20</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
      <div style="width:56px; height:56px; background:var(--cream-200); border:1px solid var(--cream-300); border-radius:28px;"></div>
      <span style="font-family:var(--font-mono); font-size:10px; color:var(--cream-700);">2xl · 28</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
      <div style="width:56px; height:56px; background:var(--cream-200); border:1px solid var(--cream-300); border-radius:999px;"></div>
      <span style="font-family:var(--font-mono); font-size:10px; color:var(--cream-700);">pill</span>
    </div>
  </div>
  <div style="margin-top:14px; font-family:var(--font-body); font-size:11px; color:var(--cream-700);">Inputs &amp; small buttons → sm/md · Cards → lg · Hero / lookbook cards &amp; sheets → xl/2xl · Badges → pill</div>
</div>
</body></html>
