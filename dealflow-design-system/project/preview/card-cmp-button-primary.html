<!doctype html>
<!-- @dsCard group="Components" name="Button · primary" subtitle="Default / hover / focus / disabled" viewport="700x160" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .btn{display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border-radius:10px; font-family:var(--font-body); font-size:14px; font-weight:500; line-height:1; border:1px solid transparent; cursor:pointer; transition:all 200ms cubic-bezier(0.2,0,0,1);}
  .btn-primary{background:var(--teal-500); color:var(--cream-50);}
  .btn-primary.hover{background:var(--teal-600);}
  .btn-primary.focus{background:var(--teal-500); box-shadow:0 0 0 3px rgba(194,110,58,0.25);}
  .btn-primary.disabled{background:var(--teal-500); opacity:0.45;}
  .label{font-family:var(--font-mono); font-size:10px; color:var(--cream-700); margin-top:8px; text-align:center;}
</style>
</head>
<body>
<div class="card">
  <div style="display:flex; gap:24px; justify-content:space-around; align-items:flex-start;">
    <div style="display:flex; flex-direction:column; align-items:center;">
      <button class="btn btn-primary">Publish catalog</button>
      <div class="label">default</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center;">
      <button class="btn btn-primary hover">Publish catalog</button>
      <div class="label">hover</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center;">
      <button class="btn btn-primary focus">Publish catalog</button>
      <div class="label">focus · ember ring</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center;">
      <button class="btn btn-primary disabled">Publish catalog</button>
      <div class="label">disabled · 0.45</div>
    </div>
  </div>
</div>
</body></html>
