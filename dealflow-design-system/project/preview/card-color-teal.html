<!doctype html>
<!-- @dsCard group="Colors" name="Teal scale" subtitle="Primary brand · 500 is the anchor" viewport="700x160" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:grid; grid-template-columns:repeat(10, 1fr); gap:6px;">
    <div class="col"><div class="swatch light" style="background:#EAF1EE;">50</div></div>
    <div class="col"><div class="swatch light" style="background:#C6DAD3;">100</div></div>
    <div class="col"><div class="swatch light" style="background:#95B9AE;">200</div></div>
    <div class="col"><div class="swatch" style="background:#5D8E81;">300</div></div>
    <div class="col"><div class="swatch" style="background:#346A5C;">400</div></div>
    <div class="col"><div class="swatch" style="background:#1F3A34; box-shadow:0 0 0 2px var(--ember-400) inset, 0 0 0 3px white inset;">500</div></div>
    <div class="col"><div class="swatch" style="background:#1A322D;">600</div></div>
    <div class="col"><div class="swatch" style="background:#142823;">700</div></div>
    <div class="col"><div class="swatch" style="background:#0E1D19;">800</div></div>
    <div class="col"><div class="swatch" style="background:#08110F;">900</div></div>
  </div>
  <div style="margin-top:14px; display:flex; justify-content:space-between; font-family:var(--font-body); font-size:11px; color:var(--cream-700);">
    <span style="letter-spacing:0.14em; text-transform:uppercase; font-weight:600;">Teal — primary</span>
    <span style="font-family:var(--font-mono);">500 is the brand · used for nav, primary buttons, headers</span>
  </div>
</div>
</body></html>
