<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="8pt base, 4px half-step" viewport="700x160" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:flex; align-items:flex-end; gap:12px;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:4px; height:4px; background:var(--teal-500); border-radius:2px;"></div><span style="font-family:var(--font-mono); font-size:10px; color:var(--cream-700);">1·4</span></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:8px; height:8px; background:var(--teal-500); border-radius:2px;"></div><span style="font-family:var(--font-mono); font-size:10px; color:var(--cream-700);">2·8</span></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:12px; height:12px; background:var(--teal-500); border-radius:2px;"></div><span style="font-family:var(--font-mono); font-size:10px; color:var(--cream-700);">3·12</span></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:16px; height:16px; background:var(--teal-500); border-radius:2px;"></div><span style="font-family:var(--font-mono); font-size:10px; color:var(--cream-700);">4·16</span></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:20px; height:20px; background:var(--teal-500); border-radius:2px;"></div><span style="font-family:var(--font-mono); font-size:10px; color:var(--cream-700);">5·20</span></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:24px; height:24px; background:var(--teal-500); border-radius:2px;"></div><span style="font-family:var(--font-mono); font-size:10px; color:var(--cream-700);">6·24</span></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:32px; height:32px; background:var(--teal-500); border-radius:2px;"></div><span style="font-family:var(--font-mono); font-size:10px; color:var(--cream-700);">7·32</span></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:40px; height:40px; background:var(--teal-500); border-radius:2px;"></div><span style="font-family:var(--font-mono); font-size:10px; color:var(--cream-700);">8·40</span></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:56px; height:56px; background:var(--teal-500); border-radius:2px;"></div><span style="font-family:var(--font-mono); font-size:10px; color:var(--cream-700);">9·56</span></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:72px; height:72px; background:var(--teal-500); border-radius:2px;"></div><span style="font-family:var(--font-mono); font-size:10px; color:var(--cream-700);">10·72</span></div>
  </div>
  <div style="margin-top:14px; font-family:var(--font-body); font-size:11px; color:var(--cream-700);">8pt base with 4px half-step · page gutter 32 · card padding 20–24 · section gap 56–72</div>
</div>
</body></html>
