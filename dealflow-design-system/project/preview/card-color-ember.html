<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:grid; grid-template-columns:repeat(8, 1fr); gap:6px;">
    <div class="col"><div class="swatch light" style="background:#FBEFE3;">50</div></div>
    <div class="col"><div class="swatch light" style="background:#F5DAB8;">100</div></div>
    <div class="col"><div class="swatch light" style="background:#ECBC85;">200</div></div>
    <div class="col"><div class="swatch" style="background:#DC9655;">300</div></div>
    <div class="col"><div class="swatch" style="background:#C26E3A; box-shadow:0 0 0 2px var(--teal-500) inset, 0 0 0 3px white inset;">400</div></div>
    <div class="col"><div class="swatch" style="background:#A55A2B;">500</div></div>
    <div class="col"><div class="swatch" style="background:#874720;">600</div></div>
    <div class="col"><div class="swatch" style="background:#6B3818;">700</div></div>
  </div>
  <div style="margin-top:14px; display:flex; justify-content:space-between; font-family:var(--font-body); font-size:11px; color:var(--cream-700);">
    <span style="letter-spacing:0.14em; text-transform:uppercase; font-weight:600;">Ember — accent</span>
    <span style="font-family:var(--font-mono);">400 is the accent · focus rings, "new" markers, one CTA per page</span>
  </div>
</div>
</body></html>
