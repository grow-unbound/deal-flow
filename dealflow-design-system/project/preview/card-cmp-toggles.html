<!doctype html>
<!-- @dsCard group="Components" name="Checkbox · radio · toggle" subtitle="Quiet controls, teal-500 selected" viewport="700x180" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .toggle{position:relative; width:36px; height:20px; background:var(--cream-400); border-radius:999px; transition:background 200ms;}
  .toggle::after{content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; background:#fff; border-radius:50%; box-shadow:0 1px 2px rgba(0,0,0,0.15); transition:transform 200ms;}
  .toggle.on{background:var(--teal-500);}
  .toggle.on::after{transform:translateX(16px);}
  .check{width:18px; height:18px; border-radius:5px; border:1.5px solid var(--cream-500); background:#fff;}
  .check.on{background:var(--teal-500); border-color:var(--teal-500); display:flex; align-items:center; justify-content:center;}
  .radio{width:18px; height:18px; border-radius:50%; border:1.5px solid var(--cream-500); background:#fff;}
  .radio.on{border-color:var(--teal-500); display:flex; align-items:center; justify-content:center;}
  .radio.on::after{content:""; width:8px; height:8px; border-radius:50%; background:var(--teal-500);}
  .row-i{display:flex; align-items:center; gap:10px; font-family:var(--font-body); font-size:13px; color:var(--cream-900);}
</style>
</head>
<body>
<div class="card" style="padding:24px;">
  <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:24px;">
    <div style="display:flex; flex-direction:column; gap:10px;">
      <div class="row-i"><div class="check"></div>Featured</div>
      <div class="row-i"><div class="check on"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>Visible to all buyers</div>
      <div class="row-i" style="color:var(--cream-600);"><div class="check" style="opacity:0.5;"></div>Auto-archive after 30d</div>
    </div>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <div class="row-i"><div class="radio"></div>Cohort</div>
      <div class="row-i"><div class="radio on"></div>Buyer</div>
      <div class="row-i"><div class="radio"></div>Geography</div>
    </div>
    <div style="display:flex; flex-direction:column; gap:10px;">
      <div class="row-i"><div class="toggle on"></div>Allow back-orders</div>
      <div class="row-i"><div class="toggle"></div>Hide cost prices</div>
      <div class="row-i"><div class="toggle"></div>Show MRP strikethrough</div>
    </div>
  </div>
</div>
</body></html>
