<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card" style="padding:20px;">
  <div style="display:flex; gap:20px; align-items:center; padding:24px; background:var(--cream-50); border:1px dashed var(--cream-400); border-radius:14px;">
    <img src="../assets/illustration-empty-catalog.svg" width="160" alt="">
    <div>
      <div style="font-family:var(--font-display); font-size:22px; font-weight:500; color:var(--cream-900); line-height:1.2;">No catalogs published yet</div>
      <div style="font-family:var(--font-body); font-size:13px; color:var(--cream-700); margin-top:6px; max-width:280px;">Pick a cohort, choose products, set a validity window — your retailers see it within a minute.</div>
      <button style="margin-top:12px; padding:9px 14px; border-radius:10px; background:var(--teal-500); color:#fff; border:none; font-family:var(--font-body); font-weight:500; font-size:13px;">Publish your first catalog</button>
    </div>
  </div>
</div>
</body></html>
