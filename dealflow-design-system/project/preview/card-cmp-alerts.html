<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card" style="padding:20px;">
  <div style="display:flex; flex-direction:column; gap:10px;">
    <!-- success -->
    <div style="display:flex; gap:12px; align-items:flex-start; padding:12px 14px; background:#ECF3EC; border:1px solid #C9DDC9; border-radius:10px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F5733" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 18px; margin-top:1px;"><path d="M20 6L9 17l-5-5"/></svg>
      <div style="flex:1; font-family:var(--font-body); font-size:13px; color:#2F5733; line-height:1.5;"><strong style="font-weight:600;">Catalog published.</strong> 12 buyers in <em>North Delhi · A-class</em> can see it now.</div>
      <span style="font-family:var(--font-mono); font-size:10px; color:#2F5733; opacity:0.7;">just now</span>
    </div>
    <!-- info -->
    <div style="display:flex; gap:12px; align-items:flex-start; padding:12px 14px; background:#E7EEF1; border:1px solid #C5D4DA; border-radius:10px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A4B59" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 18px; margin-top:1px;"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
      <div style="flex:1; font-family:var(--font-body); font-size:13px; color:#2A4B59; line-height:1.5;">Tally CSV exports will switch to live API in Phase 2. Your current export format will keep working.</div>
    </div>
    <!-- danger -->
    <div style="display:flex; gap:12px; align-items:flex-start; padding:12px 14px; background:#F6E5DF; border:1px solid #E0BFB3; border-radius:10px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B2615" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 18px; margin-top:1px;"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
      <div style="flex:1; font-family:var(--font-body); font-size:13px; color:#6B2615; line-height:1.5;"><strong style="font-weight:600;">We couldn't reach your Tally export endpoint.</strong> Your work is saved — try again in a moment.</div>
    </div>
  </div>
</div>
</body></html>
