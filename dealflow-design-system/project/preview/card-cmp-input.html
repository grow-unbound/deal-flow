<!doctype html>
<!-- @dsCard group="Components" name="Input fields" subtitle="Default / focus / placeholder / error" viewport="700x230" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-family:var(--font-body); font-size:12px; font-weight:500; color:var(--cream-800);}
  .input{width:100%; box-sizing:border-box; padding:10px 12px; border-radius:8px; border:1px solid var(--cream-400); background:#fff; font-family:var(--font-body); font-size:14px; color:var(--cream-900); box-shadow:inset 0 1px 0 rgba(31,58,52,0.03);}
  .input.focus{border-color:var(--teal-500); box-shadow:0 0 0 3px rgba(194,110,58,0.22), inset 0 1px 0 rgba(31,58,52,0.03);}
  .input.placeholder{color:var(--cream-600);}
  .input.error{border-color:var(--danger-500);}
  .help{font-family:var(--font-body); font-size:11px; color:var(--cream-700);}
  .help.error{color:var(--danger-500);}
</style>
</head>
<body>
<div class="card" style="padding:24px;">
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:18px;">
    <div class="field">
      <label>Brand name</label>
      <input class="input" value="WineYard Vintners" readonly>
      <div class="help">Shown to retailers as-is.</div>
    </div>
    <div class="field">
      <label>Cohort</label>
      <input class="input focus" value="North Delhi · A-class" readonly>
      <div class="help">12 buyers match this rule.</div>
    </div>
    <div class="field">
      <label>HSN code</label>
      <input class="input placeholder" value="e.g. 22042100" readonly>
      <div class="help">Required for GST export.</div>
    </div>
    <div class="field">
      <label>Base price (₹)</label>
      <input class="input error" value="-450" readonly>
      <div class="help error">Price must be greater than zero.</div>
    </div>
  </div>
</div>
</body></html>
